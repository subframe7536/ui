name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'oxlint.config.ts'
      - 'oxfmt.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'oxlint.config.ts'
      - 'oxfmt.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/CI.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm run qa
      - name: Ensure QA fixes are committed
        run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm run test
